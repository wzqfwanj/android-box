<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="在线真机（ARM 云手机）：网页里直接操作阿里云无影云手机，可安装美团等 ARM 应用。" />
  <title>安卓系统 · ARM 云手机</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../cp/WuyingWebSDK.js"></script>
  <script defer src="../cloud.js"></script>
</head>
<body>
  <main>
    <header class="head">
      <div>
        <h1>安卓系统 · ARM 云手机</h1>
        <p class="sub">阿里云无影云手机（Android 12 · arm64），网页里直接操作，可装美团等 ARM 应用</p>
      </div>
    </header>

    <div class="content">
      <div class="stage">
        <div class="phone cloud-phone-shell" id="phone">
          <div class="screen cloud-screen" id="screen">
            <div class="cloud-container" id="cloudContainer">
              <iframe id="sessionIframe" title="云手机画面"></iframe>
            </div>
            <div class="boot" id="boot">
              <p class="boot-title">正在连接云手机…</p>
              <p class="boot-note" id="bootNote">获取连接凭证 — 云端串流</p>
            </div>
          </div>
        </div>

        <div class="toolbar" id="toolbar">
          <button class="btn" type="button" id="reconnect">重连</button>
          <button class="btn" type="button" id="fullscreen">全屏画面</button>
          <a class="btn file-btn" href="../">切回模拟器</a>
        </div>

        <p class="status" id="status">初始化…</p>
        <p class="hint">画面来自阿里云真机，直接在画面上点按/滑动；装 APK 请用阿里云控制台或「安装 APK」页面。</p>
      </div>
    </div>
  </main>

  <noscript>
    <p class="noscript-note">操作云手机需要开启 JavaScript。</p>
  </noscript>
</body>
</html>
