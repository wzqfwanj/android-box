# =============================================================================
# android-box：把 https://wkeeli.cn/android/ 反向代理到应用机 180.76.180.249:8150
# 适用：网关机 aliyun（8.133.209.25）的 Caddy 2.x，
#       配置文件 /etc/caddy/Caddyfile 中已有的 `wkeeli.cn { ... }` 站点块。
# =============================================================================
#
# 一、插入位置
#   把下面「复制以下块」之后的内容原样粘贴进 `wkeeli.cn { ... }` 块内。
#   Caddy 的 handle 按书写顺序匹配，因此：
#     - 必须在兜底的 `reverse_proxy localhost:5000` 之前，否则永远不会命中；
#     - 建议紧跟已有的 `/phone/` handle_path 块之后（两者同属子路径应用，便于维护）。
#
# 二、为什么用 handle_path 而不是 handle
#   本应用按「子路径部署」编写：前端所有资源与 API 一律使用相对路径
#   （如 app.js、api/state、stream.mjpg，不带前导 /）。handle_path /android/* 会先剥掉
#   /android 前缀再转发，于是：
#     /android/               -> /            （index.html）
#     /android/style.css      -> /style.css
#     /android/api/health     -> /api/health
#     /android/stream.mjpg    -> /stream.mjpg （MJPEG 长连接）
#   若用 handle + 手写 strip 前缀，容易漏配，症状是「页面能打开但样式/接口 404」。
#
# 三、flush_interval -1 是 MJPEG 能实时显示的关键
#   android-box 的 /stream.mjpg 是 `multipart/x-mixed-replace` 长连接，服务端每帧 flush。
#   Caddy 默认会对响应做缓冲（攒批下发），不关闭时典型症状是：画面延迟数秒、卡住不动、
#   或只在断开时才一次性出现；因此 reverse_proxy 内必须写 `flush_interval -1`
#   （-1 = 关闭缓冲，收到数据立刻转发）。其余子路径（/phone/）是普通短响应，不需要该指令。
#
# 四、认证与安全头
#   1) 认证：wkeeli.cn 块顶部已有全站 Basic Auth（basic_auth @not_local），/android/
#      自动被覆盖；服务器本机（源 IP 127.0.0.1）发起的请求免认证。
#      应用内部没有登录页，不要在这里重复写 basic_auth。
#      注意：MJPEG 流与 API 同样受登录门保护，未登录拿不到画面。
#   2) CSP：站级响应头已是 default-src 'self'；本应用零外链，画面是同源 <img src="stream.mjpg">，
#      因此无需改动安全头。不要在本片段里加 header 指令，避免覆盖站级设置。
#   3) MJPEG 是长连接：不要在片段里加 response timeout / 压缩等指令；Caddy 默认已合适。
#   4) 本片段不包含任何账号或密码明文。
#
# 五、备份 / 插入 / 校验 / 重载（网关机 root 执行）
#   cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%Y%m%d%H%M%S)
#   vi /etc/caddy/Caddyfile                      # 按上面的位置插入片段
#   caddy validate --config /etc/caddy/Caddyfile # 必须先通过
#   systemctl reload caddy
#   systemctl status caddy --no-pager
#
#   回滚：
#   cp -a /etc/caddy/Caddyfile.bak.YYYYMMDDHHMMSS /etc/caddy/Caddyfile
#   systemctl reload caddy
#
# 六、线上验证（网关机本机；--resolve 绕过 DNS 指向本机 Caddy，
#     源 IP 127.0.0.1 免 Basic Auth，用于验证 Caddy 转发链本身）
#   curl -sk -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/android/            # 期望 200
#   curl -sk -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/android/api/health # 期望 200
#   curl -sk -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/android/style.css  # 期望 200（验证前缀已剥离）
#
#   画面流是否通（长连接，用 --max-time 取前几秒，能返回 200 即转发正常）：
#   curl -sk --max-time 3 -o /dev/null -w '%{http_code}\n' --resolve wkeeli.cn:443:127.0.0.1 https://wkeeli.cn/android/stream.mjpg
#
#   本地公网访问（Windows）：
#   curl -s -o /dev/null -w '%{http_code}\n' https://wkeeli.cn/android/   # 期望 401：全站登录门生效，属正常现象
#   浏览器登录（全站账号 wkeeli）后即可正常查看画面与操作。
#
# ========================== 复制以下块（粘贴进 wkeeli.cn 站点块内） ==========================
	# ---- android-box 子路径：/android/ ----
	# 不带尾斜杠时 308 补齐，保证相对路径解析基准正确
	redir /android /android/ 308
	handle_path /android/* {
		reverse_proxy http://180.76.180.249:8150 {
			# 便于后端/日志识别原始前缀；本应用用相对路径，不依赖该头
			header_up X-Forwarded-Prefix /android
			# 关键：关闭响应缓冲，MJPEG 才会逐帧实时到达浏览器
			flush_interval -1
		}
	}
# ========================== 片段结束 ==========================
