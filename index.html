<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="在线真安卓（ARM 云手机）：网页里开关机，开机自动创建云手机并装好美团，关机自动释放（停止计费）。" />
  <title>安卓系统 · 在线真机</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="cp/WuyingWebSDK.js"></script>
  <script defer src="cloud.js"></script>
</head>
<body>
  <main>
    <header class="head">
      <h1>安卓系统 · 在线真机</h1>
      <p class="sub">阿里云无影云手机 · Android 12 · arm64：点「开机」自动创建并装好美团，用完点「关机」自动释放（0 计费）</p>
    </header>

    <div class="stage">
      <div class="phone" id="phone">
        <div class="screen">
          <div class="cloud-container" id="cloudContainer">
            <iframe id="sessionIframe" title="云手机画面"></iframe>
          </div>
          <div class="boot" id="boot">
            <p class="boot-title" id="bootTitle">正在连接云手机…</p>
            <p class="boot-note" id="bootNote">获取连接凭证 — 云端串流</p>
          </div>
        </div>
      </div>

      <div class="power-row">
        <button class="btn btn-power" id="powerBtn" type="button" disabled>检查中…</button>
        <span class="power-state" id="powerText"></span>
      </div>

      <div class="toolbar">
        <button class="btn" type="button" id="reconnect">重连</button>
        <button class="btn" type="button" id="fullscreen">全屏画面</button>
      </div>

      <p class="status" id="status">初始化…</p>
      <p class="hint">「开机」会自动创建云手机并安装美团；「关机」会释放实例和网络，停止计费。画面里可直接点按 / 滑动 / 输入。</p>
    </div>
  </main>

  <noscript>
    <p class="noscript-note">操作云手机需要开启 JavaScript。</p>
  </noscript>
</body>
</html>
